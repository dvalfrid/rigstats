pre-commit:
  commands:
    fmt-rs:
      glob: "{src-egui,rigstats-backend}/**/*.rs"
      run: npm run fmt:rs:check
    clippy:
      glob: "{src-egui,rigstats-backend}/**/*.rs"
      run: cargo clippy --manifest-path src-egui/Cargo.toml -- -D warnings
    lint:
      glob: "frontend/**/*.js"
      run: npm run lint
    lint-md:
      glob: "*.md"
      run: npm run lint:md
