# Keeps the SHA-pinned actions and the dependencies current (#224), weekly,
# one grouped PR per ecosystem. Commit subjects follow the repo format
# (`build(deps): …`), which release-please leaves out of the changelog.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: nuget
    directories:
      - /sensor-sidecar
      - /sensor-sidecar.Tests
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]
    # Pinned on purpose to an exact pre-release with the NVML crash fix
    # (#242); moved by hand after a hardware test.
    ignore:
      - dependency-name: LibreHardwareMonitorLib
    commit-message:
      prefix: build
      include: scope
