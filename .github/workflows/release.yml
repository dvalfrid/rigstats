name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach installers to (for example v1.0.0)
        required: true
        type: string
      winget_submit:
        description: Submit this release to winget when it is published
        required: false
        type: boolean
        default: true

# Three jobs, least privilege each (#249): `build` runs third-party code
# (crates, NuGet packages, build scripts) with no secrets and a read-only
# token; `sign` alone sees the Azure signing secrets, in the
# `release-signing` environment, which waits for the owner's approval;
# `publish` alone may write to the release. Jobs run on separate runners, so
# nothing `build` runs can stay behind to read what `sign` gets.
permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.tag }}

jobs:
  # Release Please publishes the release before anything is built, and a
  # published release is "Latest" at once — so for the ~20 minutes until
  # `publish` has uploaded latest.json, every app asking
  # releases/latest/download/latest.json got a 404 and showed "Couldn't
  # update" (seen on 1.50.0). It is held back as a pre-release until then:
  # Latest stays on the last release. Runs only GitHub's own CLI — nothing
  # from the repository — so the write permission stays out of `build`. A
  # real pre-release (an RC) is left as it is.
  hold:
    name: Hold back until published
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      was_prerelease: ${{ steps.hold.outputs.was_prerelease }}
    steps:
      - name: Mark the release a pre-release while it is built
        id: hold
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)
          echo "was_prerelease=$pre" >> "$GITHUB_OUTPUT"
          if [ "$pre" = "false" ]; then
            # --latest=false too: --prerelease alone left 1.49.0 Latest.
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false
            echo "$RELEASE_TAG held back as a pre-release until it is published"
          else
            echo "$RELEASE_TAG is a pre-release; left as it is"
          fi

  build:
    name: Build (Windows)
    needs: hold
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4dfd137a5aecc12897f37a01818006f58cf58347 # 1.98.0

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-egui

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('sensor-sidecar/**/*.csproj') }}

      - name: Install cargo-deny and cargo-about
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.2

      - name: Run verification
        run: cargo xtask verify

      - name: Build release binary + sidecar
        # The tag's version goes into the app (update_check::APP_VERSION), so
        # a release candidate shows and compares 1.51.0-rc.2, not Cargo.toml's
        # 1.50.0 (#535).
        run: |
          $env:RIGSTATS_VERSION = $env:RELEASE_TAG -replace '^v', ''
          cargo xtask build

      # The whole publish folder: installer.nsi takes two of its DLLs with
      # /nonfatal, so a missing one would not stop the installer build.
      - name: Upload unsigned binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-binaries
          path: |
            target\release\rigstats.exe
            target\release\rigstats-wallpaper.exe
            target\THIRD-PARTY-NOTICES.txt
            sensor-sidecar\bin\Release\net10.0-windows\win-x64\publish\
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign And Package (Windows)
    needs: build
    runs-on: windows-latest
    # Holds the AZURE_* secrets; a run waits here for the owner's approval.
    environment: release-signing
    steps:
      # installer.nsi, assets\icon.ico, build\pawnio\, CHANGELOG.md.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Download unsigned binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-binaries

      # The binaries must be signed BEFORE makensis packs them: the sensor
      # service only accepts control-pipe clients signed by its own signer
      # (PipeClientVerifier), so an unsigned rigstats.exe / rigstats-sensor.exe
      # in the installer leaves the Control Center dead for every user. One
      # step = one Artifact Signing session = the same signing certificate.
      - name: Sign binaries
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://neu.codesigning.azure.net/
          signing-account-name: rigstats-codesign
          certificate-profile-name: RIGStats
          files: |
            ${{ github.workspace }}\target\release\rigstats.exe
            ${{ github.workspace }}\target\release\rigstats-wallpaper.exe
            ${{ github.workspace }}\sensor-sidecar\bin\Release\net10.0-windows\win-x64\publish\rigstats-sensor.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Check binary signatures (what the service will verify)
        shell: pwsh
        run: |
          $app = Get-AuthenticodeSignature 'target\release\rigstats.exe'
          $wallpaper = Get-AuthenticodeSignature 'target\release\rigstats-wallpaper.exe'
          $service = Get-AuthenticodeSignature 'sensor-sidecar\bin\Release\net10.0-windows\win-x64\publish\rigstats-sensor.exe'
          foreach ($s in $app, $wallpaper, $service) {
            "$($s.Path): $($s.Status) $($s.SignerCertificate.Thumbprint)"
            if ($s.Status -ne 'Valid') { throw "Not validly signed: $($s.Path) ($($s.Status))" }
          }
          if ($app.SignerCertificate.Thumbprint -ne $service.SignerCertificate.Thumbprint) {
            throw 'rigstats.exe and rigstats-sensor.exe have different signers - the service would refuse the app.'
          }

      - name: Install NSIS
        shell: pwsh
        run: |
          # Pinned: the installer is built by it (#224). Bump both lines together.
          choco install nsis --version=3.13.0 --allow-downgrade --no-progress -y
          $makensis = Get-ChildItem "C:\Program Files*\NSIS\makensis.exe" | Select-Object -First 1
          $nsisVersion = & $makensis.FullName /VERSION
          if ($nsisVersion -notmatch '^v3\.13(\.0)?$') { throw "Expected NSIS v3.13, got '$nsisVersion'." }
          echo "$($makensis.DirectoryName)" >> $env:GITHUB_PATH

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $version = ($env:RELEASE_TAG -replace '^v', '')
          & makensis /DVERSION=$version build\installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed ($LASTEXITCODE)." }
          "INSTALLER_PATH=$env:GITHUB_WORKSPACE\target\release\RIGStats_${version}_x64-setup.exe" >> $env:GITHUB_ENV

      - name: Sign installer
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://neu.codesigning.azure.net/
          signing-account-name: rigstats-codesign
          certificate-profile-name: RIGStats
          files: ${{ env.INSTALLER_PATH }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Check installer signature
        shell: pwsh
        run: |
          $s = Get-AuthenticodeSignature $env:INSTALLER_PATH
          "$($s.Path): $($s.Status) $($s.SignerCertificate.Subject)"
          if ($s.Status -ne 'Valid') { throw "Installer not validly signed ($($s.Status))." }

      - name: Upload signed installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-installer
          path: ${{ env.INSTALLER_PATH }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish (Windows)
    needs: [hold, sign]
    runs-on: windows-latest
    permissions:
      contents: write
      actions: write # starts winget-submit.yml
    steps:
      # CHANGELOG.md and tools\release-highlights.ps1.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Download signed installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-installer
          path: target\release

      - name: Generate latest.json update manifest
        shell: pwsh
        run: |
          $version  = ($env:RELEASE_TAG -replace '^v', '')
          $exePath  = (Get-ChildItem "target\release\RIGStats_*_x64-setup.exe" | Select-Object -First 1).FullName
          $basename = Split-Path $exePath -Leaf
          $pubDate  = (Get-Date -AsUTC -Format "yyyy-MM-ddTHH:mm:ssZ")
          $repoUrl  = "https://github.com/dvalfrid/rigstats"

          # The app refuses an update whose download doesn't match this.
          $hash = (Get-FileHash $exePath -Algorithm SHA256).Hash.ToLower()

          # Extract this version's section from CHANGELOG.md for in-app display.
          $changelogMd = Get-Content "CHANGELOG.md" -Raw
          $escapedVer  = [regex]::Escape($version)
          $clMatch     = [regex]::Match($changelogMd, "(?ms)^(## \[$escapedVer\].+?)(?=^## \[|\z)")
          $notes       = if ($clMatch.Success) { $clMatch.Value.Trim() } else { "See ${repoUrl}/releases/tag/$env:RELEASE_TAG" }
          # The release's highlights (release-highlights.md), first — only a
          # list for this version counts (see docs/release.md).
          $notes = (& tools\release-highlights.ps1 -Version $version -Notes $notes) -join "`n"

          $manifest = [ordered]@{
            version  = $version
            notes    = $notes
            pub_date = $pubDate
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                sha256    = $hash
                url       = "${repoUrl}/releases/download/$env:RELEASE_TAG/${basename}"
              }
            }
          } | ConvertTo-Json -Depth 5

          $manifest | Out-File "latest.json" -Encoding UTF8NoBOM
          Write-Host "Generated latest.json for v$version"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          files: |
            target\release\RIGStats_*_x64-setup.exe
            latest.json

      # The files are there: now it may be Latest, and apps are offered it.
      # Before the winget step, which skips a pre-release.
      - name: Make it the latest release
        if: ${{ needs.hold.outputs.was_prerelease == 'false' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --prerelease=false --latest
          Write-Host "$env:RELEASE_TAG is the latest release"

      # The highlights above the text release-please wrote — only a list for
      # this version (release-highlights.md); otherwise nothing changes.
      - name: Put the release highlights on the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = ($env:RELEASE_TAG -replace '^v', '')
          $highlights = (& tools\release-highlights.ps1 -Version $version -Body) -join "`n"
          if (-not $highlights) { Write-Host "No highlights for $version"; exit 0 }
          $generated = (gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json body --jq .body) -join "`n"
          if ($generated -match '(?m)^## Highlights') { Write-Host "Highlights already on the release"; exit 0 }
          Set-Content notes.md -Value ($highlights + "`n" + $generated) -Encoding utf8NoBOM
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --notes-file notes.md
          Write-Host "Highlights added to $env:RELEASE_TAG"

      # A "## Thanks" block at the end of the release text for the people
      # outside the core team whose work is in it — commit authors and
      # co-authors since the previous release, not the owner or bots
      # (tools/release-contributors.ps1). Nothing when there are none.
      - name: Thank the contributors on the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $thanks = (& tools\release-contributors.ps1 -Tag $env:RELEASE_TAG -Repo $env:GITHUB_REPOSITORY -Owner $env:GITHUB_REPOSITORY_OWNER) -join "`n"
          if (-not $thanks) { Write-Host "No contributors outside the core team"; exit 0 }
          $body = (gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json body --jq .body) -join "`n"
          if ($body -match '(?m)^## Thanks') { Write-Host "Thanks already on the release"; exit 0 }
          Set-Content notes.md -Value ($body.TrimEnd() + "`n`n" + $thanks) -Encoding utf8NoBOM
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --notes-file notes.md
          Write-Host "Contributors thanked on $env:RELEASE_TAG"

      # Dispatched, not chained with `workflow_run`: this run was started with
      # GITHUB_TOKEN, and GitHub starts no workflow from a GITHUB_TOKEN-caused
      # event except a dispatch (#246). Not for pre-releases, nor when the
      # release PR carried `winget: hold` (winget_submit = false).
      - name: Dispatch winget submission
        if: ${{ github.event.inputs.winget_submit != 'false' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = process.env.RELEASE_TAG;
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            });
            if (release.prerelease) {
              core.info(`Winget: ${tag} is a pre-release, not submitted`);
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'winget-submit.yml',
              ref: 'main',
              inputs: { tag },
            });
            core.info(`Winget: submission of ${tag} started`);
