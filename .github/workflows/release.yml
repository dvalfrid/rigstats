name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach installers to (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: true

jobs:
  release:
    name: Build And Publish Release (Windows)
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.tag }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-egui

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('sensor-sidecar/**/*.csproj') }}

      - name: Run verification
        run: cargo xtask verify

      - name: Build release binary + sidecar
        run: cargo xtask build

      # The binaries must be signed BEFORE makensis packs them: the sensor
      # service only accepts control-pipe clients signed by its own signer
      # (PipeClientVerifier), so an unsigned rigstats.exe / rigstats-sensor.exe
      # in the installer leaves the Control Center dead for every user. One
      # step = one Trusted Signing session = the same signing certificate.
      - name: Sign binaries
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://neu.codesigning.azure.net/
          trusted-signing-account-name: rigstats-codesign
          certificate-profile-name: RIGStats
          files: |
            ${{ github.workspace }}\target\release\rigstats.exe
            ${{ github.workspace }}\target\release\rigstats-wallpaper.exe
            ${{ github.workspace }}\sensor-sidecar\bin\Release\net10.0-windows\win-x64\publish\rigstats-sensor.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Check binary signatures (what the service will verify)
        shell: pwsh
        run: |
          $app = Get-AuthenticodeSignature 'target\release\rigstats.exe'
          $wallpaper = Get-AuthenticodeSignature 'target\release\rigstats-wallpaper.exe'
          $service = Get-AuthenticodeSignature 'sensor-sidecar\bin\Release\net10.0-windows\win-x64\publish\rigstats-sensor.exe'
          foreach ($s in $app, $wallpaper, $service) {
            "$($s.Path): $($s.Status) $($s.SignerCertificate.Thumbprint)"
            if ($s.Status -ne 'Valid') { throw "Not validly signed: $($s.Path) ($($s.Status))" }
          }
          if ($app.SignerCertificate.Thumbprint -ne $service.SignerCertificate.Thumbprint) {
            throw 'rigstats.exe and rigstats-sensor.exe have different signers - the service would refuse the app.'
          }

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          $nsis = (Get-ChildItem "C:\Program Files*\NSIS\makensis.exe" | Select-Object -First 1).DirectoryName
          echo "$nsis" >> $env:GITHUB_PATH

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $version = ($env:RELEASE_TAG -replace '^v', '')
          & makensis /DVERSION=$version build\installer.nsi
          "INSTALLER_PATH=$env:GITHUB_WORKSPACE\target\release\RIGStats_${version}_x64-setup.exe" >> $env:GITHUB_ENV

      - name: Sign installer
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://neu.codesigning.azure.net/
          trusted-signing-account-name: rigstats-codesign
          certificate-profile-name: RIGStats
          files: ${{ env.INSTALLER_PATH }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Generate latest.json update manifest
        shell: pwsh
        run: |
          $version  = ($env:RELEASE_TAG -replace '^v', '')
          $exePath  = (Get-ChildItem "target\release\RIGStats_*_x64-setup.exe" | Select-Object -First 1).FullName
          $basename = Split-Path $exePath -Leaf
          $pubDate  = (Get-Date -AsUTC -Format "yyyy-MM-ddTHH:mm:ssZ")
          $repoUrl  = "https://github.com/dvalfrid/rigstats"

          # The app refuses an update whose download doesn't match this.
          $hash = (Get-FileHash $exePath -Algorithm SHA256).Hash.ToLower()

          # Extract this version's section from CHANGELOG.md for in-app display.
          $changelogMd = Get-Content "CHANGELOG.md" -Raw
          $escapedVer  = [regex]::Escape($version)
          $clMatch     = [regex]::Match($changelogMd, "(?ms)^(## \[$escapedVer\].+?)(?=^## \[|\z)")
          $notes       = if ($clMatch.Success) { $clMatch.Value.Trim() } else { "See ${repoUrl}/releases/tag/$env:RELEASE_TAG" }

          $manifest = [ordered]@{
            version  = $version
            notes    = $notes
            pub_date = $pubDate
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                sha256    = $hash
                url       = "${repoUrl}/releases/download/$env:RELEASE_TAG/${basename}"
              }
            }
          } | ConvertTo-Json -Depth 5

          $manifest | Out-File "latest.json" -Encoding UTF8NoBOM
          Write-Host "Generated latest.json for v$version"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          files: |
            target\release\RIGStats_*_x64-setup.exe
            latest.json
