name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Installer (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4dfd137a5aecc12897f37a01818006f58cf58347 # 1.98.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-egui

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('sensor-sidecar/**/*.csproj') }}

      - name: Install cargo-deny and cargo-about
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.2

      - name: Run verify pipeline
        run: cargo xtask verify

      - name: Build release binary + sidecar
        run: cargo xtask build

      - name: Install NSIS
        shell: pwsh
        run: |
          # Pinned: the installer is built by it (#224). Bump both lines together.
          choco install nsis --version=3.13.0 --allow-downgrade --no-progress -y
          $makensis = Get-ChildItem "C:\Program Files*\NSIS\makensis.exe" | Select-Object -First 1
          $nsisVersion = & $makensis.FullName /VERSION
          if ($nsisVersion -notmatch '^v3\.13(\.0)?$') { throw "Expected NSIS v3.13, got '$nsisVersion'." }
          echo "$($makensis.DirectoryName)" >> $env:GITHUB_PATH

      - name: Build NSIS installer
        shell: pwsh
        run: |
          # Only the package's own `version = "…"` line — dependency tables like
          # `tokio = { version = "1", … }` match too, and several matches made an
          # array that PowerShell turned into "System.Object[]".
          $version = (Select-String -Path "src-egui/Cargo.toml" -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if (-not $version) { throw "No package version in src-egui/Cargo.toml." }
          & makensis /DVERSION=$version build\installer.nsi

      - name: Upload NSIS installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rigstats-nsis
          path: target\release\RIGStats_*_x64-setup.exe
          if-no-files-found: error
