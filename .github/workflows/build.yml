name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Installer (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4dfd137a5aecc12897f37a01818006f58cf58347 # 1.98.0
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-egui

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('sensor-sidecar/**/*.csproj') }}

      - name: Run verify pipeline
        run: cargo xtask verify

      - name: Build release binary + sidecar
        run: cargo xtask build

      - name: Install NSIS
        shell: pwsh
        run: |
          # Pinned: the installer is built by it (#224). Bump both lines together.
          choco install nsis --version=3.13.0 --allow-downgrade --no-progress -y
          $makensis = Get-ChildItem "C:\Program Files*\NSIS\makensis.exe" | Select-Object -First 1
          $nsisVersion = & $makensis.FullName /VERSION
          if ($nsisVersion -notmatch '^v3\.13(\.0)?$') { throw "Expected NSIS v3.13, got '$nsisVersion'." }
          echo "$($makensis.DirectoryName)" >> $env:GITHUB_PATH

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $version = (Get-Content "src-egui/Cargo.toml" | Select-String 'version = "').ToString().Trim() -replace '.*version = "([^"]+)".*', '$1'
          & makensis /DVERSION=$version build\installer.nsi

      - name: Upload NSIS installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rigstats-nsis
          path: target\release\RIGStats_*_x64-setup.exe
          if-no-files-found: error
