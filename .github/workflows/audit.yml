name: Audit

# Weekly dependency audit (#224), so a new advisory against an unchanged
# Cargo.lock / NuGet graph shows up without a push. The same checks run on
# every push in `cargo xtask verify`.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit dependencies
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-deny
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2

      - name: Rust advisories
        run: cargo deny check advisories

      # NuGetAudit (Directory.Build.props) fails the restore on a known
      # vulnerability of moderate severity or worse.
      - name: NuGet advisories
        run: |
          dotnet restore sensor-sidecar/sensor-sidecar.csproj
          dotnet restore sensor-sidecar.Tests/sensor-sidecar.Tests.csproj
