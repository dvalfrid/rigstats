name: Audit

# Weekly dependency audit (#224), so a new advisory against an unchanged
# Cargo.lock / NuGet graph shows up without a push. The same checks run on
# every push in `cargo xtask verify`.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit dependencies
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK (version from global.json)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Install cargo-deny
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.20.2

      - name: Rust advisories
        run: cargo deny check advisories

      # NuGetAudit (Directory.Build.props) fails the restore on a known
      # vulnerability of moderate severity or worse.
      - name: NuGet advisories
        run: |
          dotnet restore sensor-sidecar/sensor-sidecar.csproj
          dotnet restore sensor-sidecar.Tests/sensor-sidecar.Tests.csproj
