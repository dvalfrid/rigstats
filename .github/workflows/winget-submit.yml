name: Submit to Winget

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  # Manual escape hatch: `workflow_run` only fires for Release runs that
  # completed on the default branch. Re-running Release via workflow_dispatch
  # against a tag ref (see docs/release.md's "Manual re-run" section) doesn't
  # qualify, so it silently never chains into this workflow.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  submit:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    steps:
      - name: Get latest release version
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag     = gh release list --repo ${{ github.repository }} --limit 1 --json tagName --jq '.[0].tagName'
          $version = $tag -replace '^v', ''
          "tag=$tag"         >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Check for an open winget-pkgs PR
        id: existing-pr
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $openPr = gh pr list --repo microsoft/winget-pkgs --search "Codeby.RIGStats in:title" --state open --json url --jq '.[0].url'
          if ($openPr) {
            Write-Host "Skipping submission — an update PR is already open: $openPr"
          }
          "skip=$(if ($openPr) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - name: Install wingetcreate
        if: steps.existing-pr.outputs.skip != 'true'
        shell: pwsh
        run: Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile wingetcreate.exe

      - name: Submit manifest to winget-pkgs
        if: steps.existing-pr.outputs.skip != 'true'
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $v   = "${{ steps.release.outputs.version }}"
          $url = "https://github.com/dvalfrid/rigstats/releases/download/v${v}/RIGStats_${v}_x64-setup.exe"
          .\wingetcreate.exe update Codeby.RIGStats `
            --version $v `
            --urls "$url|x64|machine" `
            --token $env:WINGET_TOKEN `
            --submit
