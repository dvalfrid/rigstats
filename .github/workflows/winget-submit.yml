name: Submit to Winget

# Started by release.yml once a release is published (unless its release PR
# carried `winget: hold`), or by hand: Actions → Submit to Winget → Run
# workflow → the tag (#246).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to submit (for example v1.44.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  submit:
    runs-on: windows-latest
    steps:
      - name: Resolve release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          $info = gh release view $env:TAG --repo ${{ github.repository }} --json tagName,isPrerelease,isDraft | ConvertFrom-Json
          if (-not $info) { throw "No release '$env:TAG'." }
          if ($info.isDraft -or $info.isPrerelease) { throw "'$env:TAG' is a draft or pre-release; winget gets published releases only." }
          $version = $info.tagName -replace '^v', ''
          "tag=$($info.tagName)" >> $env:GITHUB_OUTPUT
          "version=$version"     >> $env:GITHUB_OUTPUT

      - name: Check for an open winget-pkgs PR
        id: existing-pr
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $openPr = gh pr list --repo microsoft/winget-pkgs --search "Codeby.RIGStats in:title" --state open --json url --jq '.[0].url'
          if ($openPr) {
            Write-Host "Skipping submission — an update PR is already open: $openPr"
          }
          "skip=$(if ($openPr) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - name: Install wingetcreate
        if: steps.existing-pr.outputs.skip != 'true'
        shell: pwsh
        run: Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile wingetcreate.exe

      - name: Submit manifest to winget-pkgs
        if: steps.existing-pr.outputs.skip != 'true'
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $v   = "${{ steps.release.outputs.version }}"
          $url = "https://github.com/dvalfrid/rigstats/releases/download/v${v}/RIGStats_${v}_x64-setup.exe"
          .\wingetcreate.exe update Codeby.RIGStats `
            --version $v `
            --urls "$url|x64|machine" `
            --token $env:WINGET_TOKEN `
            --submit
