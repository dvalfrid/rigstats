# cargo-deny (#224): only the security advisories check is used for now —
# `cargo deny check advisories`, run by `cargo xtask verify` and weekly by
# .github/workflows/audit.yml. Licences, bans and sources stay off.

[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
# Each entry needs the advisory id and why it doesn't apply / can't be fixed yet.
ignore = [
    # chrono is unmaintained (#752): a notice, not a known vulnerability, and no
    # replacement version exists. wmi 0.18 depends on it too, so it stays in the
    # lock file whatever our code does. Moving our own code off it: #753.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; also a wmi dependency; migration tracked in #753" },
]
