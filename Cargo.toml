[workspace]
members = ["src-egui", "rigstats-backend", "xtask"]
default-members = ["src-egui", "rigstats-backend"]
exclude = ["third_party"]
resolver = "2"

# The lints every crate has (#680); a crate opts in with
# `[lints] workspace = true`. rigstats-backend keeps its own, stricter set
# (also clone_on_ref_ptr, redundant_clone, needless_pass_by_value). Measured
# on src-egui 2026-10-30 and left off there: clone_on_ref_ptr finds 82
# `arc.clone()` → `Arc::clone(&arc)` rewrites, style only; redundant_clone
# finds 8, of which 6 are false (the value is used again — clippy's own fix
# doesn't compile); needless_pass_by_value fits egui's move-into-closure
# code poorly.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"

# Smaller, faster release binaries (#467). Not panic = "abort": the tray
# thread and debug::supervise rely on catch_unwind.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# egui-wgpu with one fix: don't keep a device open on every GPU (holds the
# dGPU of hybrid laptops awake). See third_party/egui-wgpu/RIGSTATS-PATCH.md.
# egui-winit with one fix: honour `with_has_shadow(false)` on Windows, so a
# transparent window doesn't show the DWM frame. See
# third_party/egui-winit/RIGSTATS-PATCH.md.
# tray-icon registered in notify-icon version 4, so Windows 11 shows no empty
# tooltip over the hover card. See third_party/tray-icon/RIGSTATS-PATCH.md.
[patch.crates-io]
egui-wgpu = { path = "third_party/egui-wgpu" }
egui-winit = { path = "third_party/egui-winit" }
tray-icon = { path = "third_party/tray-icon" }
