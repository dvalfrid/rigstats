[package]
name = "rigstats-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "net", "io-util", "rt", "macros"] }
# No `multithread` (rayon): a pool of one thread per core woken every
# second for the process refresh cost ~1.2 % of a core, the work itself next
# to nothing (#463). Off in both crates — Cargo unifies features.
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "network"] }
hostname = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
wmi = "0.18"
winreg = "0.56"
# Win32 (#702; winapi 0.3 is no longer used here).
windows = { version = "0.62", features = ["Win32_Devices_FunctionDiscovery", "Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }

[dev-dependencies]
tempfile = "3"

# The Win32 tests' own checks, on the windows crate already, so they don't
# change when the code under test moves off winapi (#702).
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = ["Win32_System_RemoteDesktop", "Win32_UI_WindowsAndMessaging"] }

# Its own set, stricter than the workspace's (root Cargo.toml).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
needless_pass_by_value = "warn"
