[package]
name = "rigstats-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "net", "io-util", "rt", "macros"] }
# No `multithread` (rayon): a pool of one thread per core woken every
# second for the process refresh cost ~1.2 % of a core, the work itself next
# to nothing (#463). Off in both crates — Cargo unifies features.
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "network"] }
hostname = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
wmi = "0.18"
winreg = "0.56"
winapi = { version = "0.3", features = ["winbase", "processthreadsapi", "combaseapi", "objbase", "shobjidl_core", "winerror", "windef", "wtypes", "wtypesbase", "tlhelp32", "handleapi", "mmdeviceapi", "endpointvolume", "functiondiscoverykeys_devpkey", "propsys", "propidl", "audioclient", "audiosessiontypes", "mmreg"] }

[dev-dependencies]
tempfile = "3"

# Its own set, stricter than the workspace's (root Cargo.toml).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
needless_pass_by_value = "warn"
