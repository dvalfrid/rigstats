[package]
name = "rigstats-egui"
version = "1.52.0" # x-release-please-version
edition = "2021"
rust-version = "1.89"

[lib]
name = "rigstats_egui"
path = "src/lib.rs"

[[bin]]
name = "rigstats"
path = "src/main.rs"

[[bin]]
name = "rigstats-wallpaper"
path = "src/bin/wallpaper.rs"

[dependencies]
rigstats-backend = { path = "../rigstats-backend" }
eframe = "0.37"
egui = "0.37"
# egui_plot's own version numbering trails egui's by one minor — 0.35 is the
# release that depends on egui ^0.34, matching the eframe/egui pin above.
egui_plot = "0.38"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
# No `multithread` (rayon): a pool of one thread per core woken every
# second for the process refresh cost ~1.2 % of a core, the work itself next
# to nothing (#463). Off in both crates — Cargo unifies features.
sysinfo = { version = "0.30", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tray-icon = "0.26"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp", "gif"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
zip = { version = "9", default-features = false, features = ["deflate"] }
# Already in the tree through ureq's TLS; hashes the downloaded update.
ring = "0.17"

[target.'cfg(windows)'.dependencies]
# Toasts sent as RIGStats (#447). 0.62 is already in the tree (wgpu,
# accesskit); only these features are added.
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_System_WinRT"] }
# The notification app id's registry key; the version rigstats-backend uses.
winreg = "0.52"
winapi = { version = "0.3", features = ["winuser", "windef", "libloaderapi", "shellscalingapi", "shellapi", "dwmapi", "winreg", "winerror", "processthreadsapi", "synchapi", "winbase", "handleapi", "winnt", "errhandlingapi", "pdh", "dxgi", "unknwnbase", "guiddef", "wintrust", "softpub", "wincrypt", "winver", "wingdi", "commdlg", "combaseapi", "objbase"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[target.'cfg(windows)'.dev-dependencies]
# Pinned to match the versions eframe/egui-wgpu already resolve to (see Cargo.lock),
# so the DComp spike probe (examples/dcomp_probe.rs, issue #131) doesn't perturb
# the workspace's dependency resolution.
wgpu = "30"
winit = "=0.30.13"
pollster = "=0.4.0"
raw-window-handle = "=0.6.2"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
