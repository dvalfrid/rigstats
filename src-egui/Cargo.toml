[package]
name = "rigstats-egui"
version = "1.37.0" # x-release-please-version
edition = "2021"
rust-version = "1.77"

[lib]
name = "rigstats_egui"
path = "src/lib.rs"

[[bin]]
name = "rigstats"
path = "src/main.rs"

[[bin]]
name = "rigstats-wallpaper"
path = "src/bin/wallpaper.rs"

[dependencies]
rigstats-backend = { path = "../rigstats-backend" }
eframe = "0.34"
egui = "0.34"
# egui_plot's own version numbering trails egui's by one minor — 0.35 is the
# release that depends on egui ^0.34, matching the eframe/egui pin above.
egui_plot = "0.35"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
sysinfo = "0.30"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tray-icon = "0.23"
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "windef", "libloaderapi", "shellscalingapi", "shellapi", "dwmapi", "winreg", "winerror", "processthreadsapi", "synchapi", "handleapi", "winnt"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[target.'cfg(windows)'.dev-dependencies]
# Pinned to match the versions eframe/egui-wgpu already resolve to (see Cargo.lock),
# so the DComp spike probe (examples/dcomp_probe.rs, issue #131) doesn't perturb
# the workspace's dependency resolution.
wgpu = "=29.0.3"
winit = "=0.30.13"
pollster = "=0.4.0"
raw-window-handle = "=0.6.2"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
