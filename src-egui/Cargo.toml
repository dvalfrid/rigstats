[package]
name = "rigstats-egui"
version = "1.29.0" # x-release-please-version
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "rigstats"
path = "src/main.rs"

[dependencies]
rigstats-backend = { path = "../rigstats-backend" }
eframe = "0.34"
egui = "0.34"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
sysinfo = "0.30"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tray-icon = "0.23"
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "windef", "libloaderapi", "shellscalingapi", "shellapi", "dwmapi", "winreg", "winerror"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
