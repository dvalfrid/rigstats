<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Battery</title>
<link rel="icon" type="image/x-icon" href="./favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./panel-base.css">
<style>
html, body { width: 450px; height: 336px; }
</style>
</head>
<body>
<div class="floating-drag-handle" id="dragHandle"></div>
<div class="panel panel-battery" data-panel="battery" style="height:320px">
  <div class="tl"></div><div class="br"></div>
  <div class="panel-content">
    <div class="stat-label">BATTERY</div>
    <div>
      <span class="big-num" id="batPct">--</span>
      <span class="big-unit">%</span>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--gap-inner-sm) var(--gap-inner);margin-top:var(--gap-inner-sm);">
      <div class="meta"><div class="meta-key">STATUS</div><div class="meta-val" id="batStatus">--</div></div>
      <div class="meta"><div class="meta-key">TIME LEFT</div><div class="meta-val" id="batTime">--</div></div>
      <div class="meta"><div class="meta-key">POWER</div><div class="meta-val" id="batPower">--</div></div>
    </div>
  </div>
  <div class="bars">
    <div class="bar-row">
      <div class="bar-lbl">PWR</div>
      <div class="bar-track"><div class="bar-fill" id="batBar" style="width:0%"></div></div>
      <div class="bar-pct" id="batBarPct">--%</div>
    </div>
  </div>
</div>
<script type="module" src="./renderer/panel-host.js"></script>
</body>
</html>
